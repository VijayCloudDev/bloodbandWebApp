<mat-card class="metric-card">
  <mat-card-header>
    <div mat-card-avatar class="icon-avatar brand-bg-primary">
      <mat-icon>{{ icon }}</mat-icon>
    </div>
    <mat-card-title class="metric-value">{{ value }}</mat-card-title>
    <mat-card-subtitle class="metric-label">{{ title }}</mat-card-subtitle>
  </mat-card-header>
</mat-card>
